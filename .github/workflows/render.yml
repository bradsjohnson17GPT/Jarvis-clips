name: Render Shorts

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - clips/**
      - batches/**
      - tests/**
      - config/audio.json
      - requirements-audio.txt
      - .github/workflows/render.yml

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install video renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Check manifests and rendering safeguards
        run: |
          python3 -m venv work/audio-venv
          work/audio-venv/bin/python -m pip install -r requirements-audio.txt
          work/audio-venv/bin/python -m unittest discover -s tests
      - name: Download reviewed narration voice
        run: work/audio-venv/bin/python scripts/download_voice.py
      - name: Render verified manifests (maximum ten)
        run: |
          python3 - <<'PY'
          import subprocess
          import json
          from pathlib import Path
          batch = Path('batches/current.json')
          manifests = json.loads(batch.read_text())['manifests'] if batch.exists() else [str(p) for p in sorted(Path('clips').glob('*.json'))]
          if not manifests or len(manifests) > 10 or len(set(manifests)) != len(manifests):
              raise SystemExit('Provide between one and ten independently reviewed clip manifests.')
          for manifest in manifests:
              path = Path(manifest).resolve()
              if not path.is_relative_to(Path('clips').resolve()) or path.suffix != '.json' or not path.is_file():
                  raise SystemExit('Every batch manifest must be a JSON file under clips/.')
              subprocess.run(['work/audio-venv/bin/python', 'scripts/render.py', str(path)], check=True)
          PY
      - name: Save downloadable videos and source records
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-clips-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7

