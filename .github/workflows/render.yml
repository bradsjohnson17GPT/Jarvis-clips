name: Render Shorts

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - clips/**
      - tests/**
      - .github/workflows/render.yml

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install video renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Check manifests and rendering safeguards
        run: python3 -m unittest discover -s tests
      - name: Render verified manifests (maximum ten)
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          manifests = sorted(Path('clips').glob('*.json'))
          if not manifests or len(manifests) > 10:
              raise SystemExit('Provide between one and ten independently reviewed clip manifests.')
          for manifest in manifests:
              subprocess.run(['python3', 'scripts/render.py', str(manifest)], check=True)
          PY
      - name: Save downloadable videos and source records
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-clips-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7

